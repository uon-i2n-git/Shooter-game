<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slop Burgers - Build It, Earn It</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <img class="logo-mark" src="slopburgerslogo.png" alt="Slop Burgers">
      <span class="logo-text">Slop<br>Burgers</span>
    </div>
    <nav>
      <button id="nav-menu" class="nav-btn active">Menu</button>
      <button id="nav-cart" class="nav-btn">Cart <span id="cart-count">0</span></button>
    </nav>
  </header>

  <main id="app"></main>

  <template id="tpl-menu">
    <section class="screen menu-screen">
      <h1>Build it. Earn it. Eat it.</h1>
      <p class="subtitle">Stack the burger yourself in the kitchen mini-game. Nail the order, unlock a discount on that exact burger.</p>
      <div class="menu-grid" id="menu-grid"></div>
    </section>
  </template>

  <template id="tpl-game">
    <section class="screen game-screen">
      <div class="game-header">
        <button class="back-btn" id="back-btn">← Back to menu</button>
        <h2 id="game-title"></h2>
        <div class="game-stats">
          <div class="stat"><span id="timer">30</span>s</div>
          <div class="stat stat-combo">Combo <span id="combo">0</span>x</div>
        </div>
      </div>

      <div class="stability-wrap">
        <div class="stability-label">Stability</div>
        <div class="stability-bar"><div class="stability-fill" id="stability-fill"></div></div>
      </div>

      <div class="game-body">
        <aside class="recipe-panel">
          <h3>Order ticket</h3>
          <ul id="checklist"></ul>
          <div class="tips">
            <strong>Build smart</strong>
            <ul>
              <li>Bun first — seal it with lettuce or sauce</li>
              <li>Cheese melts only on a hot patty</li>
              <li>Heavy patties low, delicate veg high</li>
              <li>Don't stack two slippery layers</li>
              <li>Work fast — the clock counts</li>
            </ul>
          </div>
        </aside>

        <div class="kitchen">
          <div class="stack-wrap"><div class="stack" id="stack"></div></div>
          <div class="feedback" id="feedback"></div>
          <div class="conveyor" id="conveyor"></div>
        </div>
      </div>

      <div class="game-overlay hidden" id="overlay"></div>
    </section>
  </template>

  <template id="tpl-cart">
    <section class="screen cart-screen">
      <h1>Your order</h1>
      <div id="cart-items"></div>
      <div class="cart-summary" id="cart-summary"></div>
      <button class="primary-btn" id="checkout-btn">Checkout</button>
    </section>
  </template>

  <script src="menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
